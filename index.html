<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air Music</title><meta name="description" content="we want air, we need music">
<link rel="stylesheet" href="style.css"></head>
<body><main class="home">
<section class="hero">
<img class="logo" src="img/logo.svg" alt="Air Music">
<ul class="menu">
<li><a href="cafe-chantant.html" data-tag="racconti, copertine e storie di musica">Cafe Chantant</a></li>
<li><a href="inspira-espira.html" data-tag="respiro di libertà musicale" data-script>Inspira—Espira</a></li>

</ul></section>
<p class="tagline" id="tag">we want air, we need music</p>
</main>
<script>
const tag=document.getElementById('tag'),def=tag.textContent;
document.querySelectorAll('.menu a').forEach(a=>{
 const on=()=>{tag.textContent=a.dataset.tag;tag.classList.add('script')};
 const off=()=>{tag.textContent=def;tag.classList.remove('script')};
 a.addEventListener('mouseenter',on);a.addEventListener('focus',on);
 a.addEventListener('mouseleave',off);a.addEventListener('blur',off);
});
</script></body></html>
